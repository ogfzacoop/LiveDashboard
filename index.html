<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veridian Systems</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0B1F3A; /* navy */
    color: #F5F1E8; /* cream/white */
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
  }
  .brand {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #C9A45C; /* deep gold */
    margin-bottom: 6px;
  }
  .tagline {
    font-size: 13px;
    color: #9AA8C4;
    margin-bottom: 40px;
    letter-spacing: 0.3px;
  }
  .divider {
    width: 48px;
    height: 3px;
    background: #C9A45C;
    margin: 0 auto 28px auto;
    border-radius: 2px;
  }
  .message {
    font-size: 18px;
    line-height: 1.6;
    color: #F5F1E8;
  }
  .footer {
    margin-top: 40px;
    font-size: 12px;
    color: #6B7A99;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">VERIDIAN SYSTEMS</div>
    <div class="tagline">Smarter Systems. Simpler Work.</div>
    <div class="divider"></div>
    <div class="message">
      This site has been temporarily suspended by the owner.
    </div>
    <div class="footer">&copy; Veridian Systems</div>
  </div>
</body>
</html>
